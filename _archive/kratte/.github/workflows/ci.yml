name: Shopwise checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: shopwise-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopwise_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shopwise_ci
      APP_MODE: test
      NEXT_TELEMETRY_DISABLED: 1
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --import tsx --test tests/unit/*.test.ts
      - run: node --conditions=react-server --import tsx scripts/migrate.ts
      - run: node --conditions=react-server --import tsx scripts/migrate.ts
      - run: node --conditions=react-server --import tsx --test tests/integration/*.test.ts
      - run: npx drizzle-kit check
      - run: npx next typegen
      - run: npm exec tsc -- --noEmit --pretty false
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start built application
        run: |
          npm run start > /tmp/shopwise.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/shopwise.log
          exit 1
      - run: node scripts/verify-production.mjs
      - run: node scripts/verify.mjs
      - run: node scripts/verify-inventory-board.mjs
      - run: node scripts/verify-focused-ui.mjs
      - run: node scripts/verify-reliability.mjs
      - name: Stop test application
        if: always()
        run: pkill -f "next-server" || true
