<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SnapLedger Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<style>
  :root {
    --bg: #0a0a0f;
    --bg-card: #13131a;
    --bg-input: #1e1e2a;
    --border: #2a2a3a;
    --text-primary: #f0f0ff;
    --text-secondary: #8888aa;
    --text-muted: #55556a;
    --accent: #6c63ff;
    --success-bg: rgba(34, 197, 94, 0.12);
    --success: #22c55e;
    --warning: #f59e0b;
    --warning-bg: rgba(245, 158, 11, 0.12);
    --blue: #3b82f6;
    --blue-bg: rgba(59, 130, 246, 0.12);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; -webkit-font-smoothing: antialiased; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 40px 20px 80px;
    background-image: radial-gradient(ellipse 60% 40% at 50% -10%, rgba(108,99,255,0.10), transparent);
  }
  .container { max-width: 800px; margin: 0 auto; }

  /* Header */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 12px; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #6c63ff, #8b5cf6);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 12px rgba(108,99,255,0.4);
    flex-shrink: 0;
  }
  .header-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .header-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    padding: 16px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .search-wrap { position: relative; flex: 1; }
  .search-wrap input {
    width: 100%; padding: 9px 12px 9px 34px;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text-primary);
    font-family: inherit; font-size: 13px; outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 13px; pointer-events: none; }

  button.refresh-btn {
    padding: 8px 16px;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text-secondary);
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; flex-shrink: 0;
  }
  button.refresh-btn:hover { border-color: var(--accent); color: var(--text-primary); }

  /* Table */
  .table-wrap {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; padding: 12px 16px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    color: var(--text-muted); text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }
  td { padding: 13px 16px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.15s; }
  tbody tr:hover { background: rgba(108,99,255,0.04); }

  .email { font-weight: 500; color: var(--text-primary); }
  .count { color: var(--text-secondary); }
  .date { color: var(--text-muted); font-size: 12px; }

  /* Plan badge */
  .plan-badge {
    display: inline-flex; align-items: center;
    padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .plan-badge.free { background: rgba(255,255,255,0.07); color: var(--text-secondary); }
  .plan-badge.pro { background: var(--success-bg); color: var(--success); }
  .plan-badge.business { background: var(--blue-bg); color: var(--blue); }

  /* Plan selector */
  .plan-cell { display: flex; align-items: center; gap: 10px; }
  select.plan-select {
    padding: 5px 10px;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-primary);
    font-family: inherit; font-size: 12px; font-weight: 500;
    cursor: pointer; outline: none; transition: border-color 0.15s;
  }
  select.plan-select:focus { border-color: var(--accent); }

  .saving-indicator { font-size: 11px; color: var(--text-muted); display: none; }
  .saving-indicator.visible { display: inline; }

  /* Empty / loading */
  .empty-row td {
    text-align: center; color: var(--text-muted);
    padding: 48px 0; font-size: 14px;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 12px 18px; border-radius: 10px;
    font-size: 13px; font-weight: 500;
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-primary); box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transform: translateY(80px); opacity: 0;
    transition: all 0.3s ease;
    z-index: 100;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: rgba(34,197,94,0.4); color: #4ade80; }
  .toast.error { border-color: rgba(239,68,68,0.4); color: #fca5a5; }
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <div class="header-left">
      <div class="logo">🦅</div>
      <div>
        <div class="header-title">SnapLedger Admin</div>
        <div class="header-sub">Activate plans after verifying M-Pesa / Airtel / USDT payments</div>
      </div>
    </div>
  </header>

  <div class="stats" id="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-label">Total users</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-pro" style="color:#22c55e">—</div>
      <div class="stat-label">Pro subscribers</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-receipts">—</div>
      <div class="stat-label">Receipts scanned</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="search" id="search-input" placeholder="Filter by email…" oninput="filterTable()" />
    </div>
    <button class="refresh-btn" onclick="loadUsers()">↻ Refresh</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Receipts</th>
          <th>Joined</th>
          <th>Plan</th>
        </tr>
      </thead>
      <tbody id="users-body">
        <tr class="empty-row"><td colspan="4">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = "";
let allUsers = [];

async function loadUsers() {
  const body = document.getElementById("users-body");
  body.innerHTML = '<tr class="empty-row"><td colspan="4">Loading…</td></tr>';

  try {
    const res = await fetch(`${API_BASE}/api/v1/admin/users`);
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    allUsers = await res.json();

    // Update stats
    document.getElementById("stat-total").textContent = allUsers.length;
    document.getElementById("stat-pro").textContent = allUsers.filter(u => u.plan !== "free").length;
    document.getElementById("stat-receipts").textContent = allUsers.reduce((s, u) => s + u.receipt_count, 0);

    renderUsers(allUsers);
  } catch (err) {
    body.innerHTML = `<tr class="empty-row"><td colspan="4">⚠ Could not reach API: ${err.message}</td></tr>`;
  }
}

function renderUsers(users) {
  const body = document.getElementById("users-body");
  if (users.length === 0) {
    body.innerHTML = '<tr class="empty-row"><td colspan="4">No users yet — snap a receipt in the app first.</td></tr>';
    return;
  }

  body.innerHTML = users.map(u => `
    <tr data-email="${u.email.toLowerCase()}">
      <td class="email">${escHtml(u.email)}</td>
      <td class="count">${u.receipt_count}</td>
      <td class="date">${new Date(u.created_at).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</td>
      <td>
        <div class="plan-cell">
          <span class="plan-badge ${u.plan}">${u.plan}</span>
          <select class="plan-select" onchange="setPlan('${u.id}', this, this.value)" data-current="${u.plan}">
            ${["free","pro","business"].map(p => `<option value="${p}"${p === u.plan ? " selected" : ""}>${p}</option>`).join("")}
          </select>
          <span class="saving-indicator" id="saving-${u.id}">saving…</span>
        </div>
      </td>
    </tr>
  `).join("");
}

function filterTable() {
  const q = document.getElementById("search-input").value.toLowerCase();
  const filtered = q ? allUsers.filter(u => u.email.toLowerCase().includes(q)) : allUsers;
  renderUsers(filtered);
}

async function setPlan(userId, selectEl, plan) {
  const indicator = document.getElementById(`saving-${userId}`);
  if (indicator) { indicator.classList.add("visible"); }
  selectEl.disabled = true;

  try {
    const res = await fetch(`${API_BASE}/api/v1/admin/users/${userId}/plan`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ plan }),
    });
    if (!res.ok) throw new Error(`${res.status}`);
    showToast(`Plan updated to ${plan}`, "success");
    // Refresh to get updated badge
    await loadUsers();
  } catch (err) {
    showToast(`Failed: ${err.message}`, "error");
    selectEl.value = selectEl.dataset.current;
    selectEl.disabled = false;
    if (indicator) indicator.classList.remove("visible");
  }
}

function showToast(msg, type = "success") {
  const t = document.getElementById("toast");
  t.textContent = (type === "success" ? "✓ " : "⚠ ") + msg;
  t.className = `toast ${type} show`;
  setTimeout(() => { t.classList.remove("show"); }, 3000);
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

loadUsers();
</script>
</body>
</html>
