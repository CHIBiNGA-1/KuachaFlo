<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>KuachaFlo Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<style>
  :root {
    --bg: #0a0a0f;
    --bg-card: #13131a;
    --bg-input: #1e1e2a;
    --border: #2a2a3a;
    --text-primary: #f0f0ff;
    --text-secondary: #8888aa;
    --text-muted: #55556a;
    --accent: #6c63ff;
    --success-bg: rgba(34, 197, 94, 0.12);
    --success: #22c55e;
    --warning: #f59e0b;
    --warning-bg: rgba(245, 158, 11, 0.12);
    --danger: #ef4444;
    --danger-bg: rgba(239, 68, 68, 0.12);
    --blue: #3b82f6;
    --blue-bg: rgba(59, 130, 246, 0.12);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; -webkit-font-smoothing: antialiased; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 40px 20px 80px;
    background-image: radial-gradient(ellipse 60% 40% at 50% -10%, rgba(108,99,255,0.10), transparent);
  }
  .container { max-width: 900px; margin: 0 auto; }
  .hidden { display: none !important; }

  /* Key gate */
  .gate {
    max-width: 380px; margin: 120px auto; text-align: center;
  }
  .gate h1 { font-size: 20px; margin-bottom: 8px; }
  .gate p { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
  .gate input {
    width: 100%; padding: 11px 14px; margin-bottom: 12px;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text-primary);
    font-family: inherit; font-size: 14px; outline: none;
  }
  .gate button {
    width: 100%; padding: 11px; background: var(--accent); border: none;
    border-radius: var(--radius); color: white; font-weight: 600;
    font-family: inherit; font-size: 14px; cursor: pointer;
  }
  .gate .err { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }

  /* Header */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #6c63ff, #8b5cf6);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 12px rgba(108,99,255,0.4);
    flex-shrink: 0;
  }
  .header-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .header-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .logout-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit;
  }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--text-muted);
    cursor: pointer; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px;
  }
  .tab.active { color: var(--text-primary); border-bottom-color: var(--accent); }
  .tab .badge {
    background: var(--danger); color: white; font-size: 10px; padding: 1px 6px;
    border-radius: 999px; font-weight: 700;
  }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    padding: 16px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .search-wrap { position: relative; flex: 1; }
  .search-wrap input {
    width: 100%; padding: 9px 12px 9px 34px;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text-primary);
    font-family: inherit; font-size: 13px; outline: none;
    transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 13px; pointer-events: none; }

  button.refresh-btn {
    padding: 8px 16px;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text-secondary);
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; flex-shrink: 0;
  }
  button.refresh-btn:hover { border-color: var(--accent); color: var(--text-primary); }

  /* Table */
  .table-wrap {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; padding: 12px 16px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    color: var(--text-muted); text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }
  td { padding: 13px 16px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.15s; }
  tbody tr:hover { background: rgba(108,99,255,0.04); }

  .email { font-weight: 500; color: var(--text-primary); }
  .count { color: var(--text-secondary); }
  .date { color: var(--text-muted); font-size: 12px; }
  .ref { font-family: monospace; font-size: 12px; background: var(--bg-input); padding: 2px 6px; border-radius: 4px; }

  /* Plan badge */
  .plan-badge, .status-badge {
    display: inline-flex; align-items: center;
    padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .plan-badge.free { background: rgba(255,255,255,0.07); color: var(--text-secondary); }
  .plan-badge.pro { background: var(--success-bg); color: var(--success); }
  .plan-badge.business { background: var(--blue-bg); color: var(--blue); }
  .status-badge.pending { background: var(--warning-bg); color: var(--warning); }
  .status-badge.confirmed { background: var(--success-bg); color: var(--success); }
  .status-badge.rejected { background: var(--danger-bg); color: var(--danger); }

  /* Plan selector */
  .plan-cell { display: flex; align-items: center; gap: 10px; }
  select.plan-select {
    padding: 5px 10px;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-primary);
    font-family: inherit; font-size: 12px; font-weight: 500;
    cursor: pointer; outline: none; transition: border-color 0.15s;
  }
  select.plan-select:focus { border-color: var(--accent); }

  .saving-indicator { font-size: 11px; color: var(--text-muted); display: none; }
  .saving-indicator.visible { display: inline; }

  .review-actions { display: flex; gap: 6px; }
  .btn-confirm, .btn-reject {
    padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; border: 1px solid transparent;
  }
  .btn-confirm { background: var(--success-bg); color: var(--success); border-color: rgba(34,197,94,0.3); }
  .btn-reject { background: var(--danger-bg); color: var(--danger); border-color: rgba(239,68,68,0.3); }
  .btn-confirm:disabled, .btn-reject:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Empty / loading */
  .empty-row td {
    text-align: center; color: var(--text-muted);
    padding: 48px 0; font-size: 14px;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 12px 18px; border-radius: 10px;
    font-size: 13px; font-weight: 500;
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-primary); box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transform: translateY(80px); opacity: 0;
    transition: all 0.3s ease;
    z-index: 100;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: rgba(34,197,94,0.4); color: #4ade80; }
  .toast.error { border-color: rgba(239,68,68,0.4); color: #fca5a5; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>🦅 KuachaFlo Admin</h1>
  <p>Enter the admin key to continue</p>
  <input type="password" id="gate-input" placeholder="Admin key" autocomplete="off" />
  <button onclick="tryKey()">Unlock</button>
  <div class="err" id="gate-err"></div>
</div>

<div class="container hidden" id="app">

  <header class="header">
    <div class="header-left">
      <div class="logo">🦅</div>
      <div>
        <div class="header-title">KuachaFlo Admin</div>
        <div class="header-sub">Activate plans after verifying MoMo payments</div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">Lock</button>
  </header>

  <div class="tabs">
    <div class="tab active" id="tab-users" onclick="switchTab('users')">Users</div>
    <div class="tab" id="tab-payments" onclick="switchTab('payments')">
      Payment Requests <span class="badge hidden" id="pending-badge">0</span>
    </div>
  </div>

  <div id="stats-row" class="stats"></div>

  <!-- USERS TAB -->
  <div id="panel-users">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="search-input" placeholder="Filter by email…" oninput="filterTable()" />
      </div>
      <button class="refresh-btn" onclick="loadUsers()">↻ Refresh</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>User</th><th>Receipts</th><th>Joined</th><th>Plan</th></tr>
        </thead>
        <tbody id="users-body">
          <tr class="empty-row"><td colspan="4">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- PAYMENTS TAB -->
  <div id="panel-payments" class="hidden">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="payments-search" placeholder="Filter by email or reference…" oninput="filterPayments()" />
      </div>
      <button class="refresh-btn" onclick="loadPayments()">↻ Refresh</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>User</th><th>Plan</th><th>Amount</th><th>Network</th><th>Reference</th><th>Status</th><th>Submitted</th><th></th></tr>
        </thead>
        <tbody id="payments-body">
          <tr class="empty-row"><td colspan="8">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = "";
let allUsers = [];
let allPayments = [];

function getKey() { return localStorage.getItem("kuachaflo_admin_key") || ""; }
function setKey(k) { localStorage.setItem("kuachaflo_admin_key", k); }
function clearKey() { localStorage.removeItem("kuachaflo_admin_key"); }

function authHeaders() {
  return { "X-Admin-Key": getKey(), "Content-Type": "application/json" };
}

async function tryKey() {
  const key = document.getElementById("gate-input").value.trim();
  if (!key) return;
  setKey(key);
  const ok = await checkKey();
  if (ok) {
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    loadUsers();
    loadPaymentsBadge();
  } else {
    clearKey();
    document.getElementById("gate-err").textContent = "Invalid key";
  }
}

async function checkKey() {
  try {
    const res = await fetch(`${API_BASE}/api/v1/admin/users`, { headers: authHeaders() });
    return res.ok;
  } catch {
    return false;
  }
}

function logout() {
  clearKey();
  document.getElementById("gate").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("gate-input").value = "";
}

function switchTab(tab) {
  document.getElementById("tab-users").classList.toggle("active", tab === "users");
  document.getElementById("tab-payments").classList.toggle("active", tab === "payments");
  document.getElementById("panel-users").classList.toggle("hidden", tab !== "users");
  document.getElementById("panel-payments").classList.toggle("hidden", tab !== "payments");
  if (tab === "payments") loadPayments();
  else loadUsers();
}

async function loadUsers() {
  const body = document.getElementById("users-body");
  body.innerHTML = '<tr class="empty-row"><td colspan="4">Loading…</td></tr>';

  try {
    const res = await fetch(`${API_BASE}/api/v1/admin/users`, { headers: authHeaders() });
    if (res.status === 401) return logout();
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    allUsers = await res.json();

    document.getElementById("stats-row").innerHTML = `
      <div class="stat-card"><div class="stat-value">${allUsers.length}</div><div class="stat-label">Total users</div></div>
      <div class="stat-card"><div class="stat-value" style="color:#22c55e">${allUsers.filter(u => u.plan !== "free").length}</div><div class="stat-label">Paying users</div></div>
      <div class="stat-card"><div class="stat-value">${allUsers.reduce((s, u) => s + u.receipt_count, 0)}</div><div class="stat-label">Receipts scanned</div></div>
    `;
    renderUsers(allUsers);
  } catch (err) {
    body.innerHTML = `<tr class="empty-row"><td colspan="4">⚠ Could not reach API: ${err.message}</td></tr>`;
  }
}

function renderUsers(users) {
  const body = document.getElementById("users-body");
  if (users.length === 0) {
    body.innerHTML = '<tr class="empty-row"><td colspan="4">No users yet — snap a receipt in the app first.</td></tr>';
    return;
  }

  body.innerHTML = users.map(u => `
    <tr data-email="${u.email.toLowerCase()}">
      <td class="email">${escHtml(u.email)}</td>
      <td class="count">${u.receipt_count}</td>
      <td class="date">${new Date(u.created_at).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</td>
      <td>
        <div class="plan-cell">
          <span class="plan-badge ${u.plan}">${u.plan}</span>
          <select class="plan-select" onchange="setPlan('${u.id}', this, this.value)" data-current="${u.plan}">
            ${["free","pro","business"].map(p => `<option value="${p}"${p === u.plan ? " selected" : ""}>${p}</option>`).join("")}
          </select>
          <span class="saving-indicator" id="saving-${u.id}">saving…</span>
        </div>
      </td>
    </tr>
  `).join("");
}

function filterTable() {
  const q = document.getElementById("search-input").value.toLowerCase();
  const filtered = q ? allUsers.filter(u => u.email.toLowerCase().includes(q)) : allUsers;
  renderUsers(filtered);
}

async function setPlan(userId, selectEl, plan) {
  const indicator = document.getElementById(`saving-${userId}`);
  if (indicator) { indicator.classList.add("visible"); }
  selectEl.disabled = true;

  try {
    const res = await fetch(`${API_BASE}/api/v1/admin/users/${userId}/plan`, {
      method: "PATCH", headers: authHeaders(), body: JSON.stringify({ plan }),
    });
    if (!res.ok) throw new Error(`${res.status}`);
    showToast(`Plan updated to ${plan}`, "success");
    await loadUsers();
  } catch (err) {
    showToast(`Failed: ${err.message}`, "error");
    selectEl.value = selectEl.dataset.current;
    selectEl.disabled = false;
    if (indicator) indicator.classList.remove("visible");
  }
}

async function loadPaymentsBadge() {
  try {
    const res = await fetch(`${API_BASE}/api/v1/admin/payment-requests?status=pending`, { headers: authHeaders() });
    if (!res.ok) return;
    const pending = await res.json();
    const badge = document.getElementById("pending-badge");
    if (pending.length > 0) {
      badge.textContent = pending.length;
      badge.classList.remove("hidden");
    } else {
      badge.classList.add("hidden");
    }
  } catch {}
}

async function loadPayments() {
  const body = document.getElementById("payments-body");
  body.innerHTML = '<tr class="empty-row"><td colspan="8">Loading…</td></tr>';

  try {
    const res = await fetch(`${API_BASE}/api/v1/admin/payment-requests`, { headers: authHeaders() });
    if (res.status === 401) return logout();
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    allPayments = await res.json();
    renderPayments(allPayments);
    loadPaymentsBadge();
  } catch (err) {
    body.innerHTML = `<tr class="empty-row"><td colspan="8">⚠ Could not reach API: ${err.message}</td></tr>`;
  }
}

function renderPayments(payments) {
  const body = document.getElementById("payments-body");
  if (payments.length === 0) {
    body.innerHTML = '<tr class="empty-row"><td colspan="8">No payment requests yet.</td></tr>';
    return;
  }

  body.innerHTML = payments.map(p => `
    <tr data-search="${(p.user_email + ' ' + p.momo_reference).toLowerCase()}">
      <td class="email">${escHtml(p.user_email)}</td>
      <td><span class="plan-badge ${p.plan_requested}">${p.plan_requested}</span></td>
      <td>${p.amount} ${p.currency}</td>
      <td>${p.momo_network.toUpperCase()}</td>
      <td><span class="ref">${escHtml(p.momo_reference)}</span></td>
      <td><span class="status-badge ${p.status}">${p.status}</span></td>
      <td class="date">${new Date(p.created_at).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</td>
      <td>
        ${p.status === "pending" ? `
          <div class="review-actions">
            <button class="btn-confirm" onclick="reviewPayment('${p.id}', 'confirm', this)">Confirm</button>
            <button class="btn-reject" onclick="reviewPayment('${p.id}', 'reject', this)">Reject</button>
          </div>
        ` : ""}
      </td>
    </tr>
  `).join("");
}

function filterPayments() {
  const q = document.getElementById("payments-search").value.toLowerCase();
  const filtered = q ? allPayments.filter(p => (p.user_email + " " + p.momo_reference).toLowerCase().includes(q)) : allPayments;
  renderPayments(filtered);
}

async function reviewPayment(id, action, btnEl) {
  const row = btnEl.closest("tr");
  row.querySelectorAll("button").forEach(b => b.disabled = true);

  try {
    const res = await fetch(`${API_BASE}/api/v1/admin/payment-requests/${id}`, {
      method: "PATCH", headers: authHeaders(), body: JSON.stringify({ action }),
    });
    if (!res.ok) throw new Error(`${res.status}`);
    showToast(action === "confirm" ? "Payment confirmed — plan activated" : "Payment rejected", "success");
    await loadPayments();
    await loadUsers();
  } catch (err) {
    showToast(`Failed: ${err.message}`, "error");
    row.querySelectorAll("button").forEach(b => b.disabled = false);
  }
}

function showToast(msg, type = "success") {
  const t = document.getElementById("toast");
  t.textContent = (type === "success" ? "✓ " : "⚠ ") + msg;
  t.className = `toast ${type} show`;
  setTimeout(() => { t.classList.remove("show"); }, 3000);
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// Auto-unlock if a valid key is already stored
(async function init() {
  if (getKey()) {
    const ok = await checkKey();
    if (ok) {
      document.getElementById("gate").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      loadUsers();
      loadPaymentsBadge();
      return;
    }
  }
  document.getElementById("gate-input").addEventListener("keydown", e => { if (e.key === "Enter") tryKey(); });
})();
</script>
</body>
</html>
