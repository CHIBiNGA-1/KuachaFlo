services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - receipt-uploads:/app/uploads     # persists photos across restarts
      - receipt-data:/app/data           # persists the SQLite db
      # Mount app code so you can edit Python files without rebuilding.
      # Uvicorn won't auto-reload (--reload is removed to avoid single-worker
      # deadlocks), so after changing code: docker compose restart backend
      - ./backend/app:/app/app
      - ./backend/static:/app/static
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000,${PRODUCTION_FRONTEND_URL:-}
      # Pulled from a .env file in this same folder (create it from
      # .env.example) — docker compose substitutes ${VARS} automatically.
      - GEMINI_API_KEY=${GEMINI_API_KEY:?Set GEMINI_API_KEY in a .env file — see .env.example}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - SUPABASE_URL=${SUPABASE_URL:?Set SUPABASE_URL in a .env file — see .env.example}
      # Defaults to the local SQLite file. Set this once you have your
      # Supabase Postgres connection string (Project Settings → Database →
      # Connection string → URI, "Transaction pooler" mode) — put your DB
      # password directly in your local .env, never paste it in chat.
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/snapledger.db}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/public:/app/public
    environment:
      # NEXT_PUBLIC_ vars are inlined at JS bundle time by Next.js.
      # This is the address your BROWSER uses to reach the backend,
      # so it must be routable from your host — not the internal docker hostname.
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL:?Set SUPABASE_URL in a .env file — see .env.example}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in a .env file — see .env.example}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  receipt-uploads:
  receipt-data:
